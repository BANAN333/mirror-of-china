name: Verify MVP website
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Check FAQ
        run: python scripts/validate_faq.py
      - name: Build full site
        run: python scripts/build_site.py
      - name: Verify site UI
        run: python scripts/check_site_ui.py
